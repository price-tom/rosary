replicaCount: 1

image:
  repository: ghcr.io/price-tom/rosary-laravel
  # "stable" is a moving tag, so always pull to pick up new builds on upgrade/restart.
  # For reproducible deploys, pin a commit tag instead: --set image.tag=<short-sha>
  pullPolicy: Always
  tag: "stable"

imagePullSecrets:
  - name: ghcr-login-secret
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: true
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: traefik-gateway
    namespace: traefik
  # Supplied at install time, e.g.
  #   doppler run -- sh -c 'helm upgrade --install rosary-app ./rosary-app --set "httpRoute.hostnames[0]=$APP_HOSTNAME"'
  hostnames: []
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# /up is Laravel's built-in health endpoint
livenessProbe:
  httpGet:
    path: /up
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /up
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

worker:
    enabled: true
    name: "worker-pvc"
    accessMode: "ReadWriteOnce"
    size: "10Gi"
    storageClass: "local-path"

worker:
  enabled: true
  replicaCount: 1

  # --timeout must stay below terminationGracePeriodSeconds so a job can finish on shutdown.
  command:
    - php
    - artisan
    - queue:work
    - --tries=3
    - --timeout=90

  terminationGracePeriodSeconds: 100

  resources: {}

# Runs `php artisan schedule:work` (routes/console.php). Always a single replica.
scheduler:
  enabled: true
  resources: {}

existingSecret: "app-secret"

cnpg:
  enabled: true
  instances: 1
  database: "rosary"
  owner: "rosary"
  secretName: "db-secret"
  storage:
    size: "1Gi"
    storageClass: "local-path"
  # Extra `testing` database for the backend test suite
  testingDatabase:
    enabled: false

redis:
  enabled: true
  image:
    repository: "docker.io/library/redis"
    tag: "7.2.5-alpine"
    pullPolicy: "IfNotPresent"
  resources: {}
  # Keeps Redis data across restarts
  persistence:
    enabled: true
    size: "1Gi"
    storageClass: "local-path"

# Dev-only PWA container (Vite dev server, driven by devspace). Production
# PWA builds are deployed to Cloudflare, not this chart.
pwa:
  enabled: false
  image:
    repository: "docker.io/library/node"
    tag: "22"
    pullPolicy: "IfNotPresent"
  # Keeps node_modules across pod restarts, for working without a registry
  nodeModules:
    enabled: false
    size: "5Gi"
    storageClass: ""

# Expose the API (and PWA, if enabled) on the tailnet as
# https://<hostname>.<tailnet>.ts.net. Usually used instead of httpRoute.
tailscale:
  enabled: false
  apiHostname: ""
  pwaHostname: ""

doppler:
  enabled: true
  project: "rosary-app"
  config: ""
  operatorNamespace: "doppler-operator-system"
  tokenSecretName: "doppler-token-secret"

# List of secrets for Doppler to sync into the target namespace
managedSecrets:
  - name: "app-secret"

  - name: "db-secret"
    processors:
      DB_USERNAME:
        type: plain
        asName: username
      DB_PASSWORD:
        type: plain
        asName: password
