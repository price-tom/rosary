{{- if .Values.doppler.enabled -}}
{{- $dot := . -}}
{{- range $secret := .Values.managedSecrets }}
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  # All DopplerSecrets live in the operator namespace, so prefix with the release
  # namespace to keep one environment's secrets from colliding with another's
  name: {{ printf "%s-%s-%s" $dot.Release.Namespace (include "rosary-app.fullname" $dot) $secret.name | trunc 63 | trimSuffix "-" }}
  namespace: {{ $dot.Values.doppler.operatorNamespace | quote }}
  labels:
    {{- include "rosary-app.labels" $dot | nindent 4 }}
spec:
  project: {{ $dot.Values.doppler.project | quote }}
  {{- if not $dot.Values.doppler.config }}
  {{- fail "dopplerSecret.spec.config is required (e.g. --set doppler.config=$DOPPLER_CONFIG)" }}
  {{- end }}
  config: {{ $dot.Values.doppler.config | quote }}
  tokenSecret:
    name: {{ $dot.Values.doppler.tokenSecretName | quote }}
    namespace: {{ $dot.Values.doppler.operatorNamespace | quote }}
  managedSecret:
    name: {{ $secret.name | quote }}
    namespace: {{ $dot.Release.Namespace | quote }}
  {{- if $secret.processors }}
  processors:
    {{- toYaml $secret.processors | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- end -}}
