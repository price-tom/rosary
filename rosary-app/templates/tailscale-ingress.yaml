{{- if .Values.tailscale.enabled }}
# Exposes the app on the tailnet only, as https://<hostname>.<tailnet>.ts.net
# Requires the Tailscale Kubernetes operator and HTTPS enabled for the tailnet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rosary-app.fullname" . }}-tailscale
  labels:
    {{- include "rosary-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: {{ include "rosary-app.fullname" . }}
      port:
        name: http
  tls:
    - hosts:
        - {{ required "tailscale.apiHostname is required" .Values.tailscale.apiHostname | quote }}
{{- if .Values.pwa.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rosary-app.fullname" . }}-pwa-tailscale
  labels:
    {{- include "rosary-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: pwa
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: {{ include "rosary-app.fullname" . }}-pwa
      port:
        name: http
  tls:
    - hosts:
        - {{ required "tailscale.pwaHostname is required" .Values.tailscale.pwaHostname | quote }}
{{- end }}
{{- end }}
